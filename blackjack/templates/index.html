<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21点 × Jev / Laya · Mind Duel</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>🂡 21点 × Jev / Laya</h1>
    <div class="subtitle">三座位 vs 庄家 · 4副牌 · Hi-Lo 计数实时展示</div>
  </header>

  <div class="controls-bar">
    <label>座位0：<select id="ctl-0"><option value="jev" selected>Jev</option><option value="human">玩家</option><option value="laya">Laya</option></select></label>
    <label>座位1：<select id="ctl-1"><option value="human" selected>玩家</option><option value="jev">Jev</option><option value="laya">Laya</option></select></label>
    <label>座位2：<select id="ctl-2"><option value="jev" selected>Jev</option><option value="human">玩家</option><option value="laya">Laya</option></select></label>
    <button id="start-btn" class="start-btn">开始新对局</button>
    <a href="/replay" style="color:#7dd3fc;font-size:13px;margin-left:4px">历史回放 →</a>
    <span id="laya-warning" class="laya-warning" style="display:none">⚠ 本服务器未启用 Laya</span>
  </div>

  <div class="count-bar" id="count-bar"></div>

  <div class="table">
    <!-- dealer -->
    <div class="dealer-zone">
      <div class="seat-head"><b>庄家</b><span class="count-tag" id="dealer-total"></span></div>
      <div class="dealer-hand" id="dealer-hand"></div>
    </div>

    <!-- 两个顶位 -->
    <div class="seat-top" id="seat-left">
      <div class="seat-head"><span class="seat-name" id="name-left"></span><span class="badge" id="badge-left"></span><span class="count-tag" id="info-left"></span></div>
      <div class="opp-hand" id="hand-left"></div>
      <div class="ai-panel" id="ai-left"></div>
    </div>
    <div class="seat-top" id="seat-right">
      <div class="seat-head"><span class="seat-name" id="name-right"></span><span class="badge" id="badge-right"></span><span class="count-tag" id="info-right"></span></div>
      <div class="opp-hand" id="hand-right"></div>
      <div class="ai-panel" id="ai-right"></div>
    </div>

    <div class="turn-hint" id="turn-hint"></div>

    <!-- 底部座位 -->
    <div class="seat-bottom">
      <div class="seat-head" style="justify-content:center"><span class="seat-name" id="name-bottom"></span><span class="badge" id="badge-bottom"></span><span class="count-tag" id="info-bottom"></span></div>
      <div class="my-hand" id="hand-bottom"></div>
      <div class="ai-panel" id="ai-bottom"></div>
      <div class="action-bar">
        <div id="bet-bar" style="display:none"></div>
        <div id="act-bar" style="display:none">
          <button class="act-btn" data-act="hit">要牌</button>
          <button class="act-btn" data-act="stand">停牌</button>
          <button class="act-btn" data-act="double">加倍</button>
        </div>
      </div>
    </div>
  </div>

  <div id="winner-overlay" class="winner-overlay" style="display:none">
    <div class="winner-card">
      <div id="winner-text">对局结束</div>
      <div class="winner-actions">
        <button id="close-winner-btn" class="ghost-btn">关闭</button>
        <a id="view-replay-btn" class="ghost-btn" href="/replay">查看本局回放</a>
        <button id="rematch-btn" class="start-btn">再来一局</button>
      </div>
    </div>
  </div>

  <footer><p class="help">每轮先下注再依次行动 · 要牌=再发一张 · 加倍=赌注翻倍只拿一张 · 庄家必须补到17点</p></footer>
</div>
<script src="/static/game.js"></script>
</body>
</html>

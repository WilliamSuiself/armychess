<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNO × Jev / Laya · Mind Duel</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="app">
  <header>
    <h1>🎴 UNO × Jev / Laya</h1>
    <div class="subtitle">四人对战 · 标准108张牌 · 先到300分获胜</div>
  </header>

  <div class="controls-bar">
    <label>座位0：<select id="ctl-0"><option value="jev" selected>Jev</option><option value="human">玩家</option><option value="laya">Laya</option></select></label>
    <label>座位1：<select id="ctl-1"><option value="human" selected>玩家</option><option value="jev">Jev</option><option value="laya">Laya</option></select></label>
    <label>座位2：<select id="ctl-2"><option value="jev" selected>Jev</option><option value="human">玩家</option><option value="laya">Laya</option></select></label>
    <label>座位3：<select id="ctl-3"><option value="jev" selected>Jev</option><option value="human">玩家</option><option value="laya">Laya</option></select></label>
    <button id="start-btn" class="start-btn">开始新对局</button>
    <a href="replay" style="color:#7dd3fc;font-size:13px;margin-left:4px">历史回放 →</a>
    <span id="laya-warning" class="laya-warning" style="display:none">⚠ 本服务器未启用 Laya</span>
  </div>

  <div class="count-bar" id="count-bar"></div>

  <div class="table">
    <div class="center-zone">
      <div class="discard-pile">
        <div class="lbl">弃牌堆顶</div>
        <div id="top-card" class="card"></div>
        <div class="lbl" id="active-color-lbl"></div>
      </div>
      <div class="deck-pile">
        <div class="lbl">抽牌堆</div>
        <div class="card back"></div>
        <div class="lbl" id="deck-count"></div>
      </div>
      <div class="direction-indicator" id="direction-indicator"></div>
    </div>

    <div class="seat-top" id="seat-1">
      <div class="seat-head"><span class="badge" id="badge-1"></span><span class="count-tag" id="info-1"></span></div>
      <div class="opp-hand" id="hand-1"></div>
      <div class="ai-panel" id="ai-1"></div>
    </div>
    <div class="seat-side" id="seat-2">
      <div class="seat-head"><span class="badge" id="badge-2"></span><span class="count-tag" id="info-2"></span></div>
      <div class="opp-hand" id="hand-2"></div>
      <div class="ai-panel" id="ai-2"></div>
    </div>
    <div class="seat-side" id="seat-3">
      <div class="seat-head"><span class="badge" id="badge-3"></span><span class="count-tag" id="info-3"></span></div>
      <div class="opp-hand" id="hand-3"></div>
      <div class="ai-panel" id="ai-3"></div>
    </div>

    <div class="turn-hint" id="turn-hint"></div>

    <div class="seat-bottom">
      <div class="seat-head" style="justify-content:center"><span class="badge" id="badge-0"></span><span class="count-tag" id="info-0"></span></div>
      <div class="my-hand" id="hand-0"></div>
      <div class="ai-panel" id="ai-0"></div>
      <div class="action-bar">
        <button id="draw-btn" class="act-btn" style="display:none">摸牌</button>
      </div>
    </div>
  </div>

  <div id="color-picker" class="color-picker-overlay" style="display:none">
    <div class="color-picker-card">
      <div style="margin-bottom:10px;font-weight:700">选择一个颜色</div>
      <div class="color-btns">
        <button class="color-btn" data-color="R" style="background:#dc2626">红</button>
        <button class="color-btn" data-color="Y" style="background:#ca8a04">黄</button>
        <button class="color-btn" data-color="G" style="background:#16a34a">绿</button>
        <button class="color-btn" data-color="B" style="background:#2563eb">蓝</button>
      </div>
    </div>
  </div>

  <div id="winner-overlay" class="winner-overlay" style="display:none">
    <div class="winner-card">
      <div id="winner-text">对局结束</div>
      <div class="winner-actions">
        <button id="close-winner-btn" class="ghost-btn">关闭</button>
        <a id="view-replay-btn" class="ghost-btn" href="replay">查看本局回放</a>
        <button id="rematch-btn" class="start-btn">再来一局</button>
      </div>
    </div>
  </div>

  <footer><p class="help">能出牌必须出 · 禁出=跳过下家 · 反转=变向 · +2/+4=下家摸牌并跳过 · 万能牌出牌后选颜色</p></footer>
</div>
<script src="static/game.js"></script>
</body>
</html>
